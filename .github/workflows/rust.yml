name: Rust

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: all-features
            features: --all-features
          - name: sled
            features: --no-default-features --features sled,selection-weighed-round-robin
          - name: blake3
            features: --no-default-features --features sled,blake3
          - name: rocksdb
            features: --no-default-features --features rocksdb,selection-weighed-round-robin
    name: Test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libssl-dev pkg-config
      - run: rustup show
      - name: Test
        run: cargo test --locked ${{ matrix.features }} -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
